# TIN Projects: build our white-labelled images and push them to GHCR.
# Release: push a tag `tin/<version>` (e.g. tin/dev-f292d16-tin.1); the image tag is <version>.
# Not v*/s* tags: those also trigger upstream's main.yml. Manual runs only work once this file is on the default branch.
name: TIN images

on:
  push:
    tags: ['tin/*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag, e.g. dev-f292d16-tin.1'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    if: github.repository == 'tin-wizard/tin-projects'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Free space
        uses: ./.github/actions/free-disk-space
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - uses: pnpm/action-setup@v5
        with:
          version: 10
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: TIN_VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#tin/}}" tin/selfhost/build-images.sh --push
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DOCKER_EXTRA: --platform=linux/amd64
